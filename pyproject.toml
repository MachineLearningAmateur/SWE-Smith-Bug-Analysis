[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssr-swesmith-coverage"
version = "0.1.0"
description = "SSR-style bug generation over SWE-smith environments, with a frozen 100-bug blind-review sample classified under the frozen AIDev failure taxonomy v1."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "requests>=2.31",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["ssr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
