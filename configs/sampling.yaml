# Selection of the 100-case blind-review sample (handoff sections 11 to 14).
#
# The population is the unique SWE-smith task instances behind the official
# training trajectories for SWE-agent-LM-32B. The goal is a sample that
# PRESERVES that population's composition, not one that imposes equal counts.
# The previous SSR plan (30 REMOVAL / 30 HISTORY_REVERSION / 40 SECOND_ORDER)
# no longer applies and is archived under archive/ssr_future/configs/.

seed: 20260830
target_n: 100
population: swe_agent_lm_32b_training_tasks

# Proportional (largest-remainder) allocation across the primary stratum, so
# the sample mirrors the population share of each generation method.
sampling: proportional_stratified
primary_stratum: generation_method

# Language is recorded but is a no-op stratum here: the task corpus at the
# pinned revision is Python-only, so every row has the same value. Kept in the
# config so the absence is explicit rather than an oversight.
secondary_balance:
  - language

# A cap, not a quota. It only binds if a repository would otherwise dominate;
# any case it displaces is recorded as a distortion in analysis/sample_balance.md.
max_per_repo: 5

avoid_duplicate_instance_ids: true

# Selection may use ONLY neutral metadata: generation method, repository,
# language, size. It may not use any taxonomy label, any AIDev frequency, any
# model classification of the bug, or perceived difficulty. No classifier is
# run over the population before selection (handoff section 22).
forbidden_selection_inputs:
  - failure_pattern
  - failure_family
  - taxonomy_fit
  - aidev_frequencies
  - model_preclassification
  - perceived_difficulty

outputs:
  review_manifest: data/review_manifest.csv
  hidden_metadata: data/hidden/sample_metadata.parquet
  balance_report: analysis/sample_balance.md

case_id_format: "SWESMITH_{index:03d}"
case_id_assignment: seeded_shuffle
