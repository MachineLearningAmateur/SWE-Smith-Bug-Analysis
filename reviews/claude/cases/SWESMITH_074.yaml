reasoning_summary: >-
  BUG_DIFF swaps operands at several independent sites in PtyProcess.spawn
  (CODE_CONTEXT_01): both error messages now apply `%` with the data on the left
  and the format string on the right, so the FileNotFoundError and the
  bad-error-data Exception raise TypeError instead, and the closerange pairing
  becomes zip([2]+fds, [max_fd]+fds), which closes the wrong ranges and drops
  passed file descriptors. Each site regresses behaviour the class already
  promised (SPECIFICATION; TEST_FAILURE_01 invalid binary, 03 preexec error, 04
  pass_fds). The scattered operand swaps are not themselves a defined pattern.
