reasoning_summary: >-
  BUG_DIFF rewrites DotEnv.dict to collect parse() into an OrderedDict first and only
  then hand values.items() to resolve_variables (CODE_CONTEXT_01). resolve_variables
  expects the raw ordered sequence of (key, value) pairs, including repeated keys,
  so that a later redefinition like c=${d} is resolved in file order; dict-ifying
  first collapses the duplicates and resolves the wrong occurrence. The change
  assumes the parsed stream can be treated as a mapping before resolution
  (SPECIFICATION, TEST_FAILURE_01).
