reasoning_summary: >-
  BUG_DIFF replaces StyleGuide.excluded's expand_paths-based check, which tested
  both the bare filename and the parent-joined path against the configured
  exclude/filename patterns, with a single call to
  self._file_checker_manager.is_path_excluded on the joined path
  (CODE_CONTEXT_01, lines 130-132). The documented behaviour - excluded if either
  form matches - is gone, and the new call depends on a manager method the packet
  does not show exists. SPECIFICATION and TEST_FAILURE_01 cover the
  parent-directory exclusion case that no longer holds.
