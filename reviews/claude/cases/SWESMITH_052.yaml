reasoning_summary: >-
  BUG_DIFF replaces the _read_item-based loop in _decode_data_sequence with a
  hand-rolled parser that compares `fp.read_tag()` directly against the integers
  0xFFFEE000 and 0xFFFEE0DD (CODE_CONTEXT_01). The traceback quoted in
  SPECIFICATION - "Unexpected tag '0xFFFEE000'" raised by the `tag != 0xFFFEE000`
  branch - shows read_tag does not return a value that compares equal to that int
  (it returns a group/element pair), so every item, including the Basic Offset
  Table, is rejected. The rewrite rests on a wrong assumption about the
  DicomBytesIO API (TEST_FAILURE_01, TEST_FAILURE_03).
