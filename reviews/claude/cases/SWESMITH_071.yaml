reasoning_summary: >-
  BUG_DIFF rewrites Optional.__init__: `self.key` is now the raw schema object
  instead of str(self._schema), the TypeError guard requiring a COMPARABLE schema
  for defaulted keys is removed, and an error=None kwarg is injected
  (CODE_CONTEXT_01). Schema.validate applies defaults by matching Optional.key
  against dict keys, so with a Literal or non-string key the default is never
  inserted; behaviour the library already promised is regressed
