reasoning_summary: >-
  BUG_DIFF rewrites uid.py into an older API shape: it adds a module __getattr__
  deprecation shim warning that "in pydicom v3.0 the UID for JPEGLossless will
  change", renames JPEGLossless to JPEGLosslessP14, and deletes the newer
  fragmentable-MPEG, JPEG XL, HTJ2K and SMPTE UIDs, then updates the two handlers
  to the old name (CODE_CONTEXT_01, CODE_CONTEXT_02). The surviving
  JPEG2000TransferSyntaxes list still references the deleted HTJ2KLossless
  (CODE_CONTEXT_03, line ~390), so `import pydicom` raises NameError
  (SPECIFICATION; all 2329 tests, TEST_FAILURE_01). The change is written against a
  pre-3.0 version of the module rather than the repository state it was applied to.
