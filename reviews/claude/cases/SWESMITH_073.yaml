reasoning_summary: >-
  BUG_DIFF rewrites Worksheet.batch_update to split the request into a `params`
  dict (valueInputOption etc.) and a body containing only data, then calls
  self.client.values_batch_update(self.spreadsheet_id, params=params, body=body)
  (CODE_CONTEXT_01). The existing client method takes the whole request as
  `body`, and the Sheets values:batchUpdate API carries those options in the
  body, so the call raises TypeError (SPECIFICATION) and would send the wrong
  shape even if it did not. The change rests on an incorrect assumption about the
  client API and data contract (TEST_FAILURE_01).
