reasoning_summary: >-
  BUG_DIFF changes both consumers' websocket_receive from
  `message.get("text") is not None` to `"text" in message` (CODE_CONTEXT_01). The
  websocket.receive message contract permits a "text" key whose value is None when a
  binary frame is delivered; the new check treats key presence as a non-None text
  frame and dispatches text_data=None instead of bytes. The change assumes a data
  contract the repository does not have (SPECIFICATION, TEST_FAILURE_01).
