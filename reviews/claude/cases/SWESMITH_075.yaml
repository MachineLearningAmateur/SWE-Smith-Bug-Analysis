  non-standard token type up to its STANDARD_TYPES ancestor and emitted every
  class along the way, with a single _get_ttype_class lookup (CODE_CONTEXT_01).
  Custom token types such as Name.Blubb now yield only their own class instead of
  "n n-Blubb", so stylesheets keyed on the hierarchical classes break; SPECIFICATION
  and TEST_FAILURE_01 (-F highlight option) cover the regression.
